---
- name: Ensure WireGuard directory exists
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Generate server private key if absent
  ansible.builtin.shell: umask 077 && wg genkey > /etc/wireguard/server_private.key
  args:
    creates: /etc/wireguard/server_private.key
  no_log: true

- name: Set server private key permissions
  ansible.builtin.file:
    path: /etc/wireguard/server_private.key
    owner: root
    group: root
    mode: '0600'

- name: Derive server public key
  ansible.builtin.shell: wg pubkey < /etc/wireguard/server_private.key > /etc/wireguard/server_public.key
  changed_when: false
  no_log: true

- name: Read server private key for configuration template
  ansible.builtin.slurp:
    src: /etc/wireguard/server_private.key
  register: server_private_key_data
  no_log: true

- name: Detect Azure internet-facing interface
  ansible.builtin.shell: ip -o -4 route show to default | awk '{print $5; exit}'
  register: uplink_interface
  changed_when: false

- name: Enable IPv4 forwarding persistently
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-wireguard-forwarding.conf
    owner: root
    group: root
    mode: '0644'
    content: "net.ipv4.ip_forward=1\n"
  notify: Apply sysctl

- name: Configure WireGuard server
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    owner: root
    group: root
    mode: '0600'
  vars:
    server_private_key: "{{ server_private_key_data.content | b64decode | trim }}"
    vpn_uplink_interface: "{{ uplink_interface.stdout | trim }}"
    active_vpn_clients: "{{ vpn_clients_with_keys }}"
  notify: Restart WireGuard

- name: Enable and start WireGuard interface
  ansible.builtin.systemd:
    name: wg-quick@wg0
    enabled: true
    state: started
    daemon_reload: true
